# The campus reader as a Cloudflare Worker. See ../README.md.
name = "preplit-campus-reader"
main = "src/index.js"
compatibility_date = "2026-10-01"

# No public address: the Worker only runs on its schedule.
workers_dev = false
preview_urls = false

[triggers]
# Every hour, at 17 past.
crons = ["17 * * * *"]

[vars]
CAMPUS_INGEST_URL = "https://www.preplitai.com/api/campus/ingest"

[observability]
enabled = true

# CAMPUS_INGEST_KEY is a secret: npm run key
