# Preplit AI on one server (Coolify, or plain `docker compose up -d --build`).
# See DEPLOY.md. Coolify: give the domain to the `web` service, port 80.
#
#   web  nginx: the website, the app at /m, and /api passed to `api`
#   api  the Express API (server/)
#   db   PostgreSQL, used unless DATABASE_URL points elsewhere (e.g. Neon)

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      PUBLIC_URL: ${PUBLIC_URL:-https://www.preplitai.com}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://www.preplitai.com,https://preplitai.com}
      # Proxies in front of the API: Coolify's proxy and nginx. Add one if Cloudflare proxies the domain too.
      TRUST_PROXY: ${TRUST_PROXY:-2}
      DATABASE_URL: ${DATABASE_URL:-postgres://preplit:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/preplit}
      PGSSL: ${PGSSL:-}
      PGSSL_REJECT_UNAUTHORIZED: ${PGSSL_REJECT_UNAUTHORIZED:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      # The language model: OpenRouter (Gemini 2.5 Flash). GEMINI_API_KEY or GROQ_API_KEY are used only without it.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Model names; empty means google/gemini-2.5-flash.
      TRANSCRIBE_MODEL: ${TRANSCRIBE_MODEL:-}
      NOTES_MODEL: ${NOTES_MODEL:-}
      CHAT_MODEL: ${CHAT_MODEL:-}
      VISION_MODEL: ${VISION_MODEL:-}
      FALLBACK_MODELS: ${FALLBACK_MODELS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      CAMPUS_INGEST_KEY: ${CAMPUS_INGEST_KEY:-}
      # Lecture Buddy's transcription service; without the key, the AI model transcribes instead.
      TRANSCRIBE_SERVICE_URL: ${TRANSCRIBE_SERVICE_URL:-https://transcribe.iw12.org}
      TRANSCRIBE_INTERNAL_API_KEY: ${TRANSCRIBE_INTERNAL_API_KEY:-${INTERNAL_API_KEY:-}}
      PILOT_INVITE_CODE: ${PILOT_INVITE_CODE:-}
      # Limits; empty means the defaults in server/config/constants.js.
      MAX_AUDIO_MB: ${MAX_AUDIO_MB:-200}
      MONTHLY_LECTURE_LIMIT: ${MONTHLY_LECTURE_LIMIT:-}
      MONTHLY_CHAT_LIMIT: ${MONTHLY_CHAT_LIMIT:-}
      DAILY_REVIEW_LIMIT: ${DAILY_REVIEW_LIMIT:-}
      PROCESSING_CONCURRENCY: ${PROCESSING_CONCURRENCY:-}
      NOTES_PART_CHARS: ${NOTES_PART_CHARS:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: preplit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: preplit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preplit -d preplit"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
