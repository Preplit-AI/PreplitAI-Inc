# Routes the site the same way vercel.json does on Vercel.

# Coolify's proxy terminates HTTPS and says so in X-Forwarded-Proto; pass that on.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Lecture recordings are uploaded whole (MAX_AUDIO_MB on the API, 200 by default).
    client_max_body_size 250M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    # For the container's health check and Coolify.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API container. Long timeouts and no buffering: uploads stream through,
    # and Juno's answers arrive as server-sent events.
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }

    # English lives at the root; old /en links go there.
    location = /en { return 301 /; }
    location = /en/ { return 301 /; }
    location ~ ^/en/(.*)$ { return 301 /$1$is_args$args; }

    # The static pages.
    location = / { try_files /index.html =404; }
    location = /ko { try_files /ko/index.html =404; }
    location = /ko/ { try_files /ko/index.html =404; }
    location = /pricing { try_files /pricing/index.html =404; }
    location = /pricing/ { try_files /pricing/index.html =404; }
    location = /ko/pricing { try_files /ko/pricing/index.html =404; }
    location = /ko/pricing/ { try_files /ko/pricing/index.html =404; }

    # The mobile app's web build: its own single page.
    location = /m { try_files /m/index.html =404; }
    location /m/ { try_files $uri /m/index.html; }

    # Files with fixed names that change: always revalidated.
    location /js/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }
    # Hashed build output: kept for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /kit/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }
    location /brand/ { try_files $uri =404; }
    location /ko/ { try_files $uri =404; }
    location /pricing/ { try_files $uri =404; }

    # Everything else is the React app (/app, /login, /signup, /privacy...).
    location / {
        try_files $uri /app.html;
    }
}
